name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # An ephemeral local MongoDB — not the real Atlas cluster the app uses
    # everywhere else. The test suite only needs a valid mongodb:// URI and
    # a database named vrchessindo_test (see .env.test); it never touches
    # the real "vrchessindo" database or needs real Atlas credentials.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017
      # Debian/Ubuntu's apt package installs here (confirmed in Dockerfile
      # for the production image, same base distro as ubuntu-latest).
      STOCKFISH_BINARY: /usr/games/stockfish

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mongodb, gd, intl
          coverage: none

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json/composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Symfony's Dotenv requires a base .env file to physically exist at
      # boot even when every real value is supplied elsewhere (.env.test,
      # or this job's own env: block above) — same fix already applied in
      # the Dockerfile for the same reason. Holds no real values.
      - name: Provide a base .env file
        run: cp example.env .env

      - name: Lint container
        run: php bin/console lint:container --env=test

      - name: Lint Twig templates
        run: php bin/console lint:twig templates/ --env=test

      - name: Run test suite
        run: vendor/bin/phpunit
