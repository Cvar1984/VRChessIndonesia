# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    VRchessIndo\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Every VRChat-touching service (VRChatClientFactory, AvatarProxyController)
        # depends on HttpClientInterface, so rebinding it here — the
        # officially-documented approach — is what actually guarantees tests
        # never reach the real api.vrchat.cloud with real credentials.
        # A runtime container override (self::getContainer()->set()) was
        # tried first and found unreliable for this exact dependency chain:
        # confirmed empirically that calls still reached the live API with
        # real credentials during a test run despite the override being in
        # place. Tests configure this shared instance per-test via
        # setResponseFactory() — see tests/Controller/VRChatControllerTest.php.
        test.mock_http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true
        Symfony\Contracts\HttpClient\HttpClientInterface: '@test.mock_http_client'
