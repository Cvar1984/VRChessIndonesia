framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Replaces the legacy avatar proxy's hand-rolled serialize()-to-disk
            # cache (cache/avatars/*.cache) with the same filesystem backend,
            # just through Symfony's PSR-6 abstraction — see AvatarProxyController.
            cache.avatars: null

            # VRChat group gallery image list + proxied image bytes — see
            # GalleryController. Same reasoning as cache.avatars: avoids
            # hitting the VRChat API (and needing a live session) on every
            # visitor's page load.
            cache.vrchat_gallery: null

            # VRChat group posts (newsletter) list — see NewsletterController.
            cache.vrchat_posts: null
