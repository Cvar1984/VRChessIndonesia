# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Production sits behind Cloudflare. X-Forwarded-For/-Proto are trusted only
    # when the connection really comes from a Cloudflare edge (or a private-network
    # proxy, e.g. a container platform's router), so getClientIp() is the visitor's
    # address — it keys the admin-login rate limit, which would otherwise count
    # every visitor sharing an edge IP together. If the web server already rewrites
    # REMOTE_ADDR to the visitor, that address isn't in these ranges and the headers
    # are simply ignored. Ranges: https://www.cloudflare.com/ips (fetched 2026-10-02).
    trusted_proxies: '173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32,PRIVATE_SUBNETS'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
